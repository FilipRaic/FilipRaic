<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 210" width="840" height="210" role="img" aria-label="Filip Raić — Full Stack Engineer, Zagreb">
  <defs>
    <pattern id="dots" width="18" height="18" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#1e293b"/>
    </pattern>
    <style>
      .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
      .trace { fill: none; stroke: #14b8a6; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
      .flow { stroke-dasharray: 6 10; animation: flow 2.4s linear infinite; }
      @keyframes flow { to { stroke-dashoffset: -32; } }
    </style>
  </defs>

  <rect width="840" height="210" rx="14" fill="#0b1220"/>
  <rect width="840" height="210" rx="14" fill="url(#dots)"/>

  <!-- tekst -->
  <text x="48" y="92" class="sans" font-size="44" font-weight="700" fill="#f8fafc">Filip Raić</text>
  <text x="50" y="126" class="sans" font-size="18" fill="#94a3b8">Full Stack Engineer <tspan fill="#475569">·</tspan> Zagreb, Croatia</text>
  <rect x="50" y="148" width="56" height="4" rx="2" fill="#14b8a6"/>
  <text x="120" y="153" class="mono" font-size="13" fill="#64748b">backend · frontend · cloud · embedded</text>

  <!-- motiv: vodovi koji spajaju kod i čip -->
  <g opacity=".9">
    <path class="trace" d="M560 60 H620 L640 80 H700"/>
    <path class="trace" d="M560 105 H700"/>
    <path class="trace" d="M560 150 H620 L640 130 H700"/>
    <path class="trace flow" stroke="#5eead4" d="M560 105 H700"/>
    <circle cx="560" cy="60" r="5" fill="#0b1220" stroke="#14b8a6" stroke-width="2"/>
    <circle cx="560" cy="105" r="5" fill="#0b1220" stroke="#14b8a6" stroke-width="2"/>
    <circle cx="560" cy="150" r="5" fill="#0b1220" stroke="#14b8a6" stroke-width="2"/>
    <text x="500" y="118" class="mono" font-size="34" fill="#14b8a6" text-anchor="middle">&lt;/&gt;</text>
    <!-- čip -->
    <rect x="700" y="60" width="90" height="90" rx="8" fill="#111827" stroke="#334155" stroke-width="2"/>
    <g stroke="#334155" stroke-width="3" stroke-linecap="round">
      <line x1="720" y1="52" x2="720" y2="60"/><line x1="745" y1="52" x2="745" y2="60"/><line x1="770" y1="52" x2="770" y2="60"/>
      <line x1="720" y1="150" x2="720" y2="158"/><line x1="745" y1="150" x2="745" y2="158"/><line x1="770" y1="150" x2="770" y2="158"/>
      <line x1="790" y1="80" x2="798" y2="80"/><line x1="790" y1="105" x2="798" y2="105"/><line x1="790" y1="130" x2="798" y2="130"/>
    </g>
    <circle cx="714" cy="74" r="3" fill="#475569"/>
    <text x="745" y="110" class="mono" font-size="13" fill="#64748b" text-anchor="middle">FR</text>
  </g>
</svg>
